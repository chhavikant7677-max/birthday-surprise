<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Happy Birthday Surekha 💗</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    display:block;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(255,40,110,.10),
            #000 70%
        );

    cursor:pointer;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#startScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.startHeart{
    width:62px;
    height:62px;

    position:relative;

    transform:rotate(-45deg);

    background:#fff7df;

    box-shadow:
        0 0 8px #fff,
        0 0 20px #ff6b98,
        0 0 42px #ff174f;

    animation:startPulse 1.5s infinite ease-in-out;
}

.startHeart:before,
.startHeart:after{
    content:"";

    position:absolute;

    width:62px;
    height:62px;

    background:#fff7df;

    border-radius:50%;
}

.startHeart:before{
    top:-31px;
}

.startHeart:after{
    left:31px;
}

@keyframes startPulse{

    0%,100%{
        transform:rotate(-45deg) scale(1);
    }

    50%{
        transform:rotate(-45deg) scale(1.12);
    }
}

.startTitle{
    margin-top:44px;

    color:white;

    font-size:clamp(20px,5vw,32px);

    font-weight:800;

    text-align:center;

    text-shadow:
        0 0 12px #fff,
        0 0 25px #ff4f83;
}

.startSub{
    margin-top:12px;

    color:rgba(255,255,255,.72);

    font-size:clamp(9px,2.6vw,15px);

    letter-spacing:3px;

    text-align:center;
}


/* =========================================================
   VIDEO SCREEN
========================================================= */

#videoScreen{
    position:fixed;
    inset:0;

    z-index:90;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    opacity:0;
    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#videoScreen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

#surpriseVideo{
    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    display:block;
}

.videoBottomText{
    position:absolute;

    left:50%;
    bottom:28px;

    transform:translateX(-50%);

    width:92%;

    text-align:center;

    color:white;

    font-size:clamp(20px,5vw,32px);

    font-weight:800;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #ff3870,
        0 0 40px #ff174f;

    pointer-events:none;
}


/* =========================================================
   CAKE SCREEN
========================================================= */

#cakeScreen{
    position:fixed;
    inset:0;

    z-index:80;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(255,40,110,.13),
            #000 70%
        );

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#cakeScreen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.cakePhoto{
    width:100px;
    height:100px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.9);

    box-shadow:
        0 0 10px #fff,
        0 0 25px #ff5b90,
        0 0 50px #ff174f;

    margin-bottom:15px;
}

.cakeTitle{
    color:white;

    font-size:clamp(18px,5vw,28px);

    font-weight:800;

    text-align:center;

    margin-bottom:22px;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff5282;
}


/* =========================================================
   CSS CAKE
========================================================= */

.cakeArea{
    position:relative;

    width:290px;
    height:240px;

    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.cake{
    position:relative;

    width:220px;
    height:105px;

    margin-bottom:20px;
}

.cakeTop{
    position:absolute;

    left:0;
    top:10px;

    width:220px;
    height:65px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            #ffd6e4 0%,
            #ff8fb4 45%,
            #ff3f78 100%
        );

    border:3px solid #ffb5cb;

    box-shadow:
        0 0 15px rgba(255,80,130,.6),
        inset 0 -10px 20px rgba(150,0,50,.2);
}

.cakeBody{
    position:absolute;

    left:7px;
    top:42px;

    width:206px;
    height:95px;

    border-radius:
        0 0 28px 28px;

    background:
        linear-gradient(
            90deg,
            #ff4f83,
            #ff9bb8,
            #ff4f83
        );

    border:3px solid #ffb7cc;

    box-shadow:
        inset 0 -15px 20px rgba(100,0,40,.25),
        0 10px 20px rgba(255,40,100,.3);
}

.cream{
    position:absolute;

    width:100%;
    height:22px;

    left:0;

    background:#fff2f6;

    border-radius:50%;

    box-shadow:
        0 0 8px rgba(255,255,255,.7);
}

.cream.one{
    top:37px;
}

.cream.two{
    top:76px;
    transform:scale(.95);
}

.candle{
    position:absolute;

    bottom:100px;

    width:13px;
    height:48px;

    border-radius:4px;

    background:
        repeating-linear-gradient(
            45deg,
            #fff,
            #fff 6px,
            #ff4f83 6px,
            #ff4f83 12px
        );

    z-index:10;
}

.candle.c1{
    left:82px;
}

.candle.c2{
    left:104px;
}

.candle.c3{
    left:126px;
}

.flame{
    position:absolute;

    width:17px;
    height:25px;

    left:-2px;
    top:-23px;

    background:
        radial-gradient(
            circle at 50% 65%,
            #fff 0 20%,
            #ffd34e 25% 55%,
            #ff6b00 65% 100%
        );

    border-radius:
        50% 50% 50% 50%;

    transform:rotate(2deg);

    filter:
        drop-shadow(0 0 7px #ffcf38);

    animation:flame 0.65s infinite alternate;
}

@keyframes flame{

    from{
        transform:scale(.9) rotate(-4deg);
    }

    to{
        transform:scale(1.08) rotate(5deg);
    }
}


/* =========================================================
   KNIFE
========================================================= */

.knife{
    position:absolute;

    right:3px;
    bottom:55px;

    width:105px;
    height:32px;

    cursor:pointer;

    transform:rotate(-27deg);

    z-index:30;

    transition:
        transform .8s ease;
}

.knifeBlade{
    position:absolute;

    left:0;
    top:4px;

    width:76px;
    height:20px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #b9c0ca,
            #f8f8f8
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            78% 100%,
            0 100%
        );

    box-shadow:
        0 0 8px rgba(255,255,255,.8);
}

.knifeHandle{
    position:absolute;

    right:0;
    top:3px;

    width:40px;
    height:22px;

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #222,
            #666,
            #111
        );

    box-shadow:0 0 7px #111;
}

.knifeText{
    margin-top:8px;

    color:rgba(255,255,255,.75);

    font-size:13px;

    letter-spacing:1px;

    text-align:center;
}


/* =========================================================
   FINAL SCREEN
========================================================= */

#finalScreen{
    position:fixed;
    inset:0;

    z-index:70;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#000;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

#finalScreen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.finalPhoto{
    width:95px;
    height:95px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid white;

    box-shadow:
        0 0 12px white,
        0 0 28px #ff5a8a,
        0 0 55px #ff174f;

    margin-bottom:25px;
}

.finalWish{
    position:relative;

    z-index:5;

    width:94%;

    text-align:center;

    color:white;

    font-size:clamp(24px,7vw,52px);

    font-weight:900;

    line-height:1.2;

    text-shadow:
        0 0 8px white,
        0 0 18px #ff5c91,
        0 0 38px #ff174f;
}

.finalSmall{
    position:relative;

    z-index:5;

    margin-top:18px;

    color:#ffb7cc;

    font-size:clamp(14px,4vw,22px);

    letter-spacing:2px;

    text-align:center;

    text-shadow:
        0 0 10px #ff4f83;
}


/* =========================================================
   CAKE CUT
========================================================= */

.cake.cut .knife{
    animation:cutCake 1.2s ease forwards;
}

@keyframes cutCake{

    0%{
        transform:
            rotate(-27deg)
            translate(0,0);
    }

    45%{
        transform:
            rotate(18deg)
            translate(-55px,40px);
    }

    100%{
        transform:
            rotate(-27deg)
            translate(0,0);
    }
}

.cake.cut .cakeBody{
    animation:cakeShake .7s ease;
}

@keyframes cakeShake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-7px);
    }

    50%{
        transform:translateX(7px);
    }

    75%{
        transform:translateX(-4px);
    }
}


/* =========================================================
   SMALL MOBILE FIX
========================================================= */

@media(max-width:500px){

    .cakeArea{
        transform:scale(.88);
    }

    .videoBottomText{
        bottom:18px;
    }

}

</style>
</head>

<body>


<!-- =======================================================
     CANVAS
======================================================== -->

<canvas id="canvas"></canvas>


<!-- =======================================================
     START SCREEN
======================================================== -->

<div id="startScreen">

    <div class="startHeart"></div>

    <div class="startTitle">
        Tap to Play Video
    </div>

    <div class="startSub">
        EXPERIENCE THE MAGIC
    </div>

</div>


<!-- =======================================================
     VIDEO SCREEN
======================================================== -->

<div id="videoScreen">

    <video
        id="surpriseVideo"
        playsinline
        preload="auto"
        controls="false">

        <source src="video1.mp4" type="video/mp4">

    </video>

        Kaisa laga surprise? 💗
    </div>

<!-- =======================================================
     CAKE SCREEN
======================================================== -->

    <img
        id="cakePhoto"
        class="cakePhoto"
        src="photo1.jpeg"
        alt="Surekha"
        onerror="this.onerror=null;this.src='photo1.jpg';">

        A Special Cake For You 🎂
    </div>

======================================================== -->

    <img
        class="finalPhoto"
        src="photo1.jpeg"
        alt="Surekha"
        onerror="this.onerror=null;this.src='photo1.jpg';">

    <div class="finalWish">
        Wishing You a Beautiful Day ✨
    </div>

    <div class="finalSmall">
        Happy Birthday Surekha 💗
    </div>

</div>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const videoScreen =
    document.getElementById("videoScreen");

const video =
    document.getElementById("surpriseVideo");

const cakeScreen =
    document.getElementById("cakeScreen");

const cakeArea =
    document.getElementById("cakeArea");

const finalScreen =
    document.getElementById("finalScreen");


/* =========================================================
   CANVAS SIZE
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


const TAU = Math.PI * 2;


/* =========================================================
   HELPERS
========================================================= */

function random(min,max){

    return Math.random() *
        (max-min) + min;
}

function clamp(v,a,b){

    return Math.max(
        a,
        Math.min(b,v)
    );
}

function easeOutCubic(t){

    return 1 -
        Math.pow(1-t,3);
}

function smootherStep(t){

    t = clamp(t,0,1);

    return t*t*t *
        (t*(t*6-15)+10);
}

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


/* =========================================================
   BACKGROUND HEARTS
========================================================= */

const hearts = [];
const streaks = [];

function createHeart(){

    hearts.push({

        x:random(-30,W+30),

        y:random(-H,H),

        size:random(5,16),

        speed:random(.25,1.1),

        drift:random(-.35,.35),

        rotation:random(-.5,.5),

        rotateSpeed:
            random(-.012,.012),

        alpha:
            random(.2,.75),

        phase:
            random(0,TAU)

    });
}

for(let i=0;i<72;i++){

    createHeart();
}


for(let i=0;i<35;i++){

    streaks.push({

        x:random(0,W),

        y:random(0,H),

        len:random(7,22),

        speed:random(.4,1.5),

        alpha:random(.15,.5)

    });
}


function drawHeart(
    x,
    y,
    size,
    alpha,
    rotation,
    color="#ff174f"
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(rotation);

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        color;

    ctx.shadowBlur =
        10;

    ctx.shadowColor =
        color;

    ctx.beginPath();

    ctx.moveTo(
        0,
        size*.85
    );

    ctx.bezierCurveTo(
        -size*1.1,
        -size*.05,
        -size*.65,
        -size,
        0,
        -size*.42
    );

    ctx.bezierCurveTo(
        size*.65,
        -size,
        size*1.1,
        -size*.05,
        0,
        size*.85
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


function drawBackground(now){

    ctx.fillStyle =
        "rgba(0,0,0,.32)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(const h of hearts){

        h.y += h.speed;

        h.x += h.drift;

        h.rotation +=
            h.rotateSpeed;


        if(h.y > H+40){

            h.y = -40;

            h.x =
                random(0,W);
        }


        const pulse =
            1 +
            Math.sin(
                now*.0018 +
                h.phase
            )*.08;


        drawHeart(
            h.x,
            h.y,
            h.size*pulse,
            h.alpha,
            h.rotation
        );
    }


    for(const s of streaks){

        s.y += s.speed;


        if(s.y > H+30){

            s.y = -30;

            s.x =
                random(0,W);
        }


        ctx.save();

        ctx.globalAlpha =
            s.alpha;

        ctx.strokeStyle =
            "#ff4774";

        ctx.lineWidth =
            1;

        ctx.shadowBlur =
            6;

        ctx.shadowColor =
            "#ff174f";

        ctx.beginPath();

        ctx.moveTo(
            s.x,
            s.y
        );

        ctx.lineTo(
            s.x+s.len*.3,
            s.y+s.len
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   PARTICLES
========================================================= */

let particles = [];

let scene = "idle";


function makeParticle(){

    return {

        x:random(0,W),

        y:random(0,H),

        sx:0,
        sy:0,

        tx:0,
        ty:0,

        size:
            random(.8,2.2),

        alpha:0,

        phase:
            random(0,TAU),

        color:"#fff",

        type:"normal"

    };
}


/* =========================================================
   PARTICLE TEXT
========================================================= */

function textPoints(
    text,
    fontSize,
    color
){

    const boxW = 1200;
    const boxH = 450;

    const off =
        document.createElement(
            "canvas"
        );

    off.width = boxW;
    off.height = boxH;

    const octx =
        off.getContext("2d");

    octx.clearRect(
        0,
        0,
        boxW,
        boxH
    );

    octx.fillStyle =
        color || "#fff";

    octx.font =
        "900 " +
        fontSize +
        "px Arial Black, Arial";

    octx.textAlign =
        "center";

    octx.textBaseline =
        "middle";

    octx.fillText(
        text,
        boxW/2,
        boxH/2
    );

    const data =
        octx.getImageData(
            0,
            0,
            boxW,
            boxH
        ).data;

    const gap =
        Math.max(
            3,
            Math.floor(fontSize/35)
        );

    const scale =
        Math.min(
            W/1100,
            H/650
        );

    const points = [];


    for(
        let y=0;
        y<boxH;
        y+=gap
    ){

        for(
            let x=0;
            x<boxW;
            x+=gap
        ){

            const i =
                (y*boxW+x)*4;


            if(data[i+3] > 100){

                points.push({

                    x:
                        W/2 +
                        (x-boxW/2) *
                        scale,

                    y:
                        H/2 +
                        (y-boxH/2) *
                        scale

                });
            }
        }
    }

    return points;
}


function distribute(
    points,
    count
){

    const result = [];

    if(!points.length)
        return result;


    for(
        let i=0;
        i<count;
        i++
    ){

        const p =
            points[
                Math.floor(
                    i/count *
                    points.length
                )
            ];

        result.push({
            x:p.x,
            y:p.y
        });
    }

    return result;
}


/* =========================================================
   FORM PARTICLE TEXT
========================================================= */

async function formText(
    text,
    color,
    options={}
){

    const fontSize =
        options.fontSize ||
        Math.min(
            W*.20,
            170
        );


    const points =
        textPoints(
            text,
            fontSize,
            color
        );


    const count =
        options.count ||
        Math.min(
            Math.max(
                points.length,
                850
            ),
            1800
        );


    particles = [];


    const targets =
        distribute(
            points,
            count
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const p =
            makeParticle();


        p.sx = p.x;
        p.sy = p.y;

        p.tx =
            targets[i].x;

        p.ty =
            targets[i].y;

        p.color =
            color;

        p.alpha = 0;

        p.size =
            random(.9,2.2);

        particles.push(p);
    }


    const start =
        performance.now();


    const duration =
        options.duration ||
        1000;


    await new Promise(
        resolve=>{

            function animate(now){

                const t =
                    clamp(
                        (now-start)/
                        duration,
                        0,
                        1
                    );


                const e =
                    easeOutCubic(t);


                for(
                    const p of particles
                ){

                    p.x =
                        p.sx +
                        (p.tx-p.sx)*e;

                    p.y =
                        p.sy +
                        (p.ty-p.sy)*e;

                    p.alpha =
                        t;
                }


                if(t<1){

                    requestAnimationFrame(
                        animate
                    );

                }else{

                    resolve();
                }
            }


            requestAnimationFrame(
                animate
            );
        }
    );


    await wait(
        options.hold || 650
    );
}


/* =========================================================
   MORPH TEXT
========================================================= */

async function morphText(
    text,
    color,
    options={}
){

    if(!particles.length){

        await formText(
            text,
            color,
            options
        );

        return;
    }


    const fontSize =
        options.fontSize ||
        Math.min(
            W*.20,
            170
        );


    const points =
        textPoints(
            text,
            fontSize,
            color
        );


    const count =
        options.count ||
        Math.min(
            Math.max(
                points.length,
                900
            ),
            1800
        );


    if(particles.length > count){

        particles.length =
            count;
    }


    while(
        particles.length < count
    ){

        const p =
            makeParticle();

        p.x =
            random(0,W);

        p.y =
            random(0,H);

        particles.push(p);
    }


    const targets =
        distribute(
            points,
            count
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const p =
            particles[i];

        p.sx = p.x;
        p.sy = p.y;

        p.tx =
            targets[i].x;

        p.ty =
            targets[i].y;

        p.color =
            color;

        p.startAlpha =
            p.alpha || 0;
    }


    const start =
        performance.now();


    const duration =
        options.duration ||
        1200;


    await new Promise(
        resolve=>{

            function animate(now){

                const t =
                    clamp(
                        (now-start)/
                        duration,
                        0,
                        1
                    );


                const e =
                    smootherStep(t);


                for(
                    const p of particles
                ){

                    p.x =
                        p.sx +
                        (p.tx-p.sx)*e;

                    p.y =
                        p.sy +
                        (p.ty-p.sy)*e;

                    p.alpha =
                        p.startAlpha +
                        (1-p.startAlpha)*e;
                }


                if(t<1){

                    requestAnimationFrame(
                        animate
                    );

                }else{

                    resolve();
                }
            }


            requestAnimationFrame(
                animate
            );
        }
    );


    await wait(
        options.hold || 700
    );
}


/* =========================================================
   EXPLODE
========================================================= */

async function explode(){

    if(!particles.length){

        await wait(400);

        return;
    }


    const start =
        performance.now();

    const duration =
        650;


    for(
        const p of particles
    ){

        const dx =
            p.x-W/2;

        const dy =
            p.y-H/2;

        const len =
            Math.hypot(
                dx,
                dy
            ) || 1;


        p.sx = p.x;
        p.sy = p.y;

        p.tx =
            p.x +
            dx/len *
            random(180,400);

        p.ty =
            p.y +
            dy/len *
            random(180,400);
    }


    await new Promise(
        resolve=>{

            function animate(now){

                const t =
                    clamp(
                        (now-start)/
                        duration,
                        0,
                        1
                    );


                const e =
                    easeOutCubic(t);


                for(
                    const p of particles
                ){

                    p.x =
                        p.sx +
                        (p.tx-p.sx)*e;

                    p.y =
                        p.sy +
                        (p.ty-p.sy)*e;

                    p.alpha =
                        1-t;
                }


                if(t<1){

                    requestAnimationFrame(
                        animate
                    );

                }else{

                    particles=[];
                    resolve();
                }
            }


            requestAnimationFrame(
                animate
            );
        }
    );
}


/* =========================================================
   BURSTS
========================================================= */

const bursts=[];


function burst(
    x,
    y,
    amount=130
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            random(0,TAU);

        const speed =
            random(1,7);


        bursts.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            size:
                random(.7,2.8),

            alpha:
                random(.5,1),

            born:
                performance.now(),

            life:
                random(500,1000),

            color:
                Math.random()>.2
                ? "#ffffff"
                : "#ff6f9d"
        });
    }
}


function drawBursts(now){

    for(
        let i=bursts.length-1;
        i>=0;
        i--
    ){

        const b =
            bursts[i];


        const t =
            (now-b.born)/
            b.life;


        if(t>=1){

            bursts.splice(i,1);

            continue;
        }


        b.x += b.vx;

        b.y += b.vy;

        b.vy += .012;


        ctx.save();

        ctx.globalAlpha =
            b.alpha*(1-t);

        ctx.fillStyle =
            b.color;

        ctx.shadowBlur =
            7;

        ctx.shadowColor =
            b.color;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            TAU
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   PARTICLE DRAW
========================================================= */

function drawParticle(
    p,
    now
){

    ctx.save();

    const pulse =
        1 +
        Math.sin(
            now*.006+p.phase
        )*.08;


    ctx.globalAlpha =
        clamp(
            p.alpha,
            0,
            1
        );


    ctx.fillStyle =
        p.color ||
        "#fff";


    ctx.shadowBlur =
        5;


    ctx.shadowColor =
        p.color ||
        "#fff";


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        p.size*pulse,
        0,
        TAU
    );

    ctx.fill();

    ctx.restore();
}

let started=false;
let videoStarted=false;

========================================================= */

        await wait(500);

/* =========================================================
   RENDER LOOP
========================================================= */

function render(now){

    /*
       Final screen ke liye black background
       ko maintain karte hain.
    */

    if(
        scene==="final" &&
        finalScreen.classList.contains("show")
    ){

        ctx.fillStyle =
            "rgba(0,0,0,.22)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }else{

        drawBackground(now);
    }


    for(
        const p of particles
    ){

        drawParticle(
            p,
            now
        );
    }


    drawBursts(now);


    requestAnimationFrame(
        render
    );
}


requestAnimationFrame(
    render
);
